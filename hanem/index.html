<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<!--
  ╔══════════════════════════════════════════════════════════════╗
  ║  شتوية هانم — صفحة تحويل الـ QR (الرابط المطبوع ثابت):       ║
  ║  https://pro7code.github.io/Nakhla-planet/hanem/            ║
  ║                                                              ║
  ║  لتغيير المنيو: استبدل رابط الدرايف في مكانين فقط:           ║
  ║   (1) سطر meta refresh تحت هذا التعليق                        ║
  ║   (2) رابط زر «افتح المنيو» (id="menu")                        ║
  ║  ثم Commit — والـ QR المطبوع يفتح الرابط الجديد تلقائيًا.      ║
  ║  ⚠️ لا تعدّل index.html الرئيسي لموقع النباتات.                ║
  ╚══════════════════════════════════════════════════════════════╝
-->
<meta http-equiv="refresh" content="4; url=https://drive.google.com/file/d/1rXUBZHY_mdwmZnE63tCKzGNESFR5boTX/view"> <!-- (1) -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1c0003">
<title>شتوية هانم — المنيو</title>
<link rel="preload" as="image" href="title.webp">
<link rel="icon" href="flower.webp" type="image/webp">
<style>
  :root { --cream:#FFEDDE; --wine:#4A0710; --ruby:#9E1B2A; --night:#1c0003; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100dvh; display: grid; place-items: center; overflow: hidden;
    color: var(--cream); text-align: center; font-family: "Georgia", "Times New Roman", serif;
    background:
      radial-gradient(60% 45% at 50% 108%, rgba(0,0,0,.65), transparent 70%),
      linear-gradient(100deg, transparent 0 18%, rgba(255,60,70,.10) 26%, transparent 34%, transparent 58%, rgba(255,60,70,.08) 66%, transparent 74%),
      linear-gradient(80deg, rgba(0,0,0,.35) 0 10%, transparent 22% 40%, rgba(0,0,0,.40) 50%, transparent 62% 80%, rgba(0,0,0,.35) 92%),
      radial-gradient(120% 90% at 50% 20%, #7a0d18 0%, #4a0710 45%, var(--night) 100%);
  }
  /* soft moving sheen, like light across velvet */
  body::after {
    content: ""; position: fixed; inset: -20%; pointer-events: none;
    background: linear-gradient(105deg, transparent 40%, rgba(255,120,120,.10) 50%, transparent 60%);
    animation: sheen 5s ease-in-out infinite;
  }
  @keyframes sheen { from { transform: translateX(-40%); } to { transform: translateX(40%); } }
  main { position: relative; z-index: 1; width: min(86vw, 440px); padding: 24px 8px; }
  .flower { width: 74px; height: 74px; margin: 0 auto 26px; display: block;
            animation: bloom 1.1s cubic-bezier(.2,1.2,.3,1) both, spin 18s linear 1.1s infinite; }
  @keyframes bloom { from { opacity: 0; transform: scale(.3) rotate(-120deg); } to { opacity: 1; transform: none; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .title { width: 100%; height: auto; display: block; animation: rise .9s .25s ease-out both;
           filter: drop-shadow(0 10px 24px rgba(0,0,0,.5)); }
  .eyebrow { margin: 18px 0 0; font-size: .62rem; letter-spacing: .28em; color: #d2413f; text-transform: uppercase;
             animation: rise .9s .45s ease-out both; }
  .status { margin: 34px 0 20px; font-family: "Segoe UI", Tahoma, system-ui, sans-serif; font-size: 1rem;
            opacity: .9; animation: rise .9s .6s ease-out both; }
  .bar { width: 120px; height: 2px; margin: 10px auto 0; background: rgba(255,237,222,.18); border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 100%; background: var(--cream); transform-origin: right;
           animation: load 1.8s .2s ease-in-out both; }
  @keyframes load { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .btn {
    display: inline-flex; align-items: center; gap: 10px; min-height: 50px; padding: 0 30px;
    border-radius: 999px; background: var(--cream); color: var(--wine); text-decoration: none;
    font-family: "Segoe UI", Tahoma, system-ui, sans-serif; font-weight: 700; font-size: 1rem;
    box-shadow: 0 14px 30px rgba(0,0,0,.45); animation: rise .9s .75s ease-out both; transition: transform .2s;
  }
  .btn:active { transform: scale(.97); }
  .btn svg { width: 18px; height: 18px; }
  .signature { width: 150px; height: auto; margin: 40px auto 0; display: block; opacity: .95;
               animation: rise .9s .9s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>
</head>
<body>
  <main>
    <img class="flower" src="flower.webp" width="674" height="674" alt="" aria-hidden="true">
    <img class="title" src="title.webp" width="2794" height="655" alt="شتوية هانم">
    <p class="eyebrow">Prepared by Mrs. Hanim</p>
    <div class="status" role="status">جارٍ فتح المنيو<div class="bar"><i></i></div></div>
    <a id="menu" class="btn" href="https://drive.google.com/file/d/1rXUBZHY_mdwmZnE63tCKzGNESFR5boTX/view"><!-- (2) -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h11a3 3 0 0 1 3 3v11H7a3 3 0 0 1-3-3V5Z"/><path d="M8 9h6M8 13h6"/></svg>
      افتح المنيو
    </a>
    <img class="signature" src="signature.webp" width="1188" height="601" alt="Hanim">
  </main>
<script>
  (function () {
    var target = document.getElementById('menu').href;
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    // A short branded moment, then straight to the menu (the button stays as a fallback).
    setTimeout(function () { location.replace(target); }, reduce ? 0 : 2000);
  })();
</script>
</body>
</html>
