<style>
  :root { --pink:#E5245D; --maroon:#8B1538; --white:#fff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100dvh; display: grid; place-items: center; overflow: hidden;
    background: radial-gradient(120% 80% at 50% 0%, #f0457a 0%, var(--pink) 55%, #c91a4f 100%);
    color: var(--white); font-family: "Segoe UI", Tahoma, system-ui, sans-serif; text-align: center;
  }
  .snow { position: fixed; inset: 0; pointer-events: none; }
  .snow i {
    position: absolute; top: -10%; color: rgba(255,255,255,.85); font-style: normal;
    animation: fall linear infinite;
  }
  @keyframes fall { to { transform: translateY(120vh) rotate(360deg); } }
  main { position: relative; width: min(88vw, 460px); padding: 24px 16px; }
  .logo { width: 100%; height: auto; display: block; filter: drop-shadow(0 18px 30px rgba(90,8,34,.45));
          animation: pop .7s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes pop { from { transform: scale(.6) rotate(-4deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .status { margin: 28px 0 18px; font-size: 1.05rem; font-weight: 700; letter-spacing: .01em; animation: fade .6s .35s both; }
  .dots span { display: inline-block; animation: blink 1.2s infinite; }
  .dots span:nth-child(2) { animation-delay: .2s; } .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100% { opacity: .2; } 40% { opacity: 1; } }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .btn {
    display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 28px;
    border-radius: 999px; background: var(--white); color: var(--maroon); font-weight: 800; font-size: 1.05rem;
    text-decoration: none; box-shadow: 0 6px 0 var(--maroon), 0 18px 30px rgba(90,8,34,.35);
    transition: transform .15s, box-shadow .15s; animation: fade .6s .5s both;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--maroon), 0 8px 16px rgba(90,8,34,.35); }
  .btn svg { width: 20px; height: 20px; }
  .tag { margin-top: 26px; font-size: .78rem; letter-spacing: .3em; opacity: .75; animation: fade .6s .65s both; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } .snow { display: none; } }
</style>
